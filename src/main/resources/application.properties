spring.application.name=apigateway
server.port=8000

# Where each service runs
gateway.services.product=${PRODUCTSERVICE_URL:http://localhost:8080}
gateway.services.user=${USERSERVICE_URL:http://localhost:8082}
gateway.services.payment=${PAYMENTSERVICE_URL:http://localhost:8083}
gateway.services.order=${ORDERSERVICE_URL:http://localhost:8084}
gateway.services.cart=${CARTSERVICE_URL:http://localhost:8085}
gateway.services.notification=${NOTIFICATIONSERVICE_URL:http://localhost:8086}

# Timeouts to the services: connect (ms) and full response
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Per-client-IP rate limit: burst of `capacity` requests, refilled at `refill-per-second`
gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
gateway.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
gateway.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:20}

# Browser origins allowed to call the API (comma-separated)
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
